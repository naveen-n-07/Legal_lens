# Netlify Configuration for METRIX-LM Frontend Application

[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Single Page Application (SPA) Client-Side Route Redirects
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and Caching Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
