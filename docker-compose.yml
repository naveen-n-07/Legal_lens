version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: metrix_postgres
    environment:
      POSTGRES_DB: metrix_lm_db
      POSTGRES_USER: metrix_admin
      POSTGRES_PASSWORD: metrix_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrix_admin -d metrix_lm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-09-16T01-01-47Z
    container_name: metrix_minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: metrix_backend
    environment:
      DATABASE_URL: postgresql://metrix_admin:metrix_password_2026@postgres:5432/metrix_lm_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadminpassword
      MINIO_BUCKET: metrix-inspections
      SECRET_KEY: metrix-lm-super-secret-jwt-key-2026-sih
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: metrix_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
